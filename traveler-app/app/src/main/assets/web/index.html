<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>GoGo</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css?v=0.12">
</head>
<body>
  <header>
    <button id="back" class="icon-button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 7.5 12 15 19.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <strong class="brand">GoGo</strong>
    <button id="settingsButton" class="icon-button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.21.37.3.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.23.08.48-.01.6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/></svg></button>
  </header>
  <main>
    <aside id="planner">
      <label>Building<select id="buildingChoice"></select></label>
      <section class="access-card" aria-label="Building accessibility"><span>Accessibility score</span><strong id="accessibilityScore"></strong></section>
      <label>Access preferences<select id="profile">
        <option value="wheelchair">Wheelchair</option>
        <option value="blind">Blind</option>
        <option value="deaf">Deaf</option>
      </select></label>
      <input id="stepfree" type="checkbox" checked hidden>
      <input id="voice" type="checkbox" checked hidden>
      <div class="field-title">Starting from</div>
      <select id="journeyType" hidden><option value="indoor" selected>Inside this building</option><option value="outdoor">Campus</option></select>
      <div id="indoorSource" class="pair">
        <label>Floor<select id="sourceFloor"></select></label>
        <label>Place<select id="source"></select></label>
      </div>
      <div class="field-title">Going to</div>
      <div class="pair">
        <label>Floor<select id="destFloor"></select></label>
        <label>Type<select id="destinationType">
          <option value="rooms">Rooms &amp; places</option>
          <option value="bathroom">Bathroom</option>
          <option value="exit">Building exit</option>
          <option value="emergency">Emergency exit</option>
        </select></label>
      </div>
      <label id="destinationField">Destination<select id="destination"></select></label>
      <p id="formStatus" class="status" role="status" hidden></p>
      <button id="start" class="primary">Start</button>
    </aside>
    <section id="journey" class="experience" hidden>
      <select id="floorSelect" aria-label="View floor" hidden></select>
      <div id="campusJourney" hidden><div id="outdoorMap" aria-label="Interactive campus map"></div><p id="tileStatus" class="status" hidden></p></div>
      <div id="scene"></div>
      <div class="guidance" role="status" aria-live="polite">
        <p id="cueMeta" hidden></p>
        <h2 id="instruction"></h2>
        <p id="detail" hidden></p>
        <div class="actions"><button id="next" class="primary">Next step</button><button id="repeat">Repeat</button></div>
      </div>
    </section>
  </main>
  <button id="voiceFab" class="voice-fab" aria-label="Talk to GoGo"><svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm-7-3a1 1 0 1 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.08A7 7 0 0 1 5 12Z"/></svg><svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3z"/></svg></button>
  <p id="assistantStatus" class="sr-only" role="status" aria-live="polite">Ready</p>
  <section id="settingsPanel" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <h2 id="settingsTitle">Voice connection</h2>
    <label>Ollama server URL<input id="ollamaServer" inputmode="url" autocomplete="off" placeholder="http://192.168.1.110:11434"></label>
    <div><button id="settingsClose">Cancel</button><button id="settingsSave" class="primary">Save</button></div>
  </section>
  <div id="settingsBackdrop" class="assistant-backdrop" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script><script type="module" src="app.js?v=0.12"></script>
</body>
</html>

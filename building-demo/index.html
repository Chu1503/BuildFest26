<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GoGo · Building Demo</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <header>
    <strong class="brand">GoGo</strong>
    <span id="buildingName">Morgridge Hall</span>
  </header>
  <main>
    <aside id="planner">
      <label>Building<select id="buildingChoice"></select></label>
      <label>Access preferences
        <select id="profile">
          <option value="wheelchair">Wheelchair</option>
          <option value="blind">Blind / low vision</option>
          <option value="deaf">Deaf / hard of hearing</option>
          <option value="mobility">Limited mobility</option>
          <option value="walking">No specific preference</option>
        </select>
      </label>
      <label class="check"><input id="stepfree" type="checkbox" checked> Avoid stairs</label>
      <div class="field-title">Start</div>
      <label>Journey
        <select id="journeyType">
          <option value="indoor">Inside this building</option>
          <option value="outdoor">Campus · Library Mall</option>
        </select>
      </label>
      <div id="indoorSource" class="pair">
        <label>Floor<select id="sourceFloor" aria-label="Starting floor"></select></label>
        <label>Place<select id="source" aria-label="Starting place"></select></label>
      </div>
      <div class="field-title">Destination</div>
      <label>Floor<select id="destFloor" aria-label="Destination floor"></select></label>
      <label>Type
        <select id="destinationType">
          <option value="rooms">Rooms & places</option>
          <option value="bathroom">Bathroom</option>
          <option value="exit">Building exit</option>
          <option value="emergency">Emergency help</option>
        </select>
      </label>
      <label id="destinationField">Place<select id="destination"></select></label>
      <section id="emergencyInfo" class="emergency" hidden>
        <p id="emergencyText"></p>
        <p>For an immediate emergency, call 911.</p>
      </section>
      <p id="formStatus" class="status" role="status"></p>
      <label class="check"><input id="voice" type="checkbox" checked> Spoken directions</label>
      <button id="start" class="primary">Start journey</button>
    </aside>
    <section id="journey" class="experience">
      <div class="toolbar">
        <button id="back" class="back" aria-label="Return to building view" hidden>Back</button>
        <div class="views" aria-label="Map view">
          <button id="overview" class="selected">Building</button>
          <button id="pov">POV</button>
          <button id="keyboard">Explore</button>
        </div>
        <select id="floorSelect" aria-label="View floor"></select>
      </div>
      <div id="campusJourney" hidden>
        <div id="outdoorMap" aria-label="Interactive campus map"></div>
        <p id="tileStatus" class="status" hidden>Map tiles unavailable.</p>
      </div>
      <div id="scene">
        <div id="walkHint" hidden>W A S D or arrows to move · drag to look · E for elevator</div>
        <div id="renderError" hidden>3D unavailable.</div>
      </div>
      <div class="guidance" role="status" aria-live="polite">
        <p id="cueMeta">READY</p>
        <h1 id="instruction">Choose a destination.</h1>
        <p id="detail"></p>
        <div class="actions">
          <button id="next" class="primary">Next step</button>
          <button id="repeat">Repeat</button>
          <button id="play">Preview route</button>
        </div>
      </div>
    </section>
  </main>
  <dialog id="liftDialog">
    <h2>Choose a floor</h2>
    <select id="liftFloor" aria-label="Elevator destination"></select>
    <button id="rideLift" class="primary">Go</button>
    <button id="closeLift">Close</button>
  </dialog>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="app.js?v=4"></script>
</body>
</html>
